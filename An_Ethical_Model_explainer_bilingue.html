<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Ethical Model — animated explainer</title>
<style>
:root{
  --paper:#f6f1e8; --paper2:#fffdf8; --ink:#1d2030; --mut:#857f72; --line:#d9d1c2;
  --inc:#b4472f; --ins:#6a4c9c; --res:#2d4f8f; --sem:#9a7419; --cont:#2c7a62; --adv:#7d1f1f; --goal:#6d7387;
  --serif:Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#12141c;overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:radial-gradient(120% 90% at 85% 0%,#fbf7ef 0%,var(--paper) 55%,#efe7d9 100%);overflow:hidden;cursor:pointer;user-select:none}
svg#cv{position:absolute;inset:0;width:1600px;height:900px}
/* header */
#hdr{position:absolute;left:80px;top:42px;transition:opacity .5s}
#kick{font:600 15px var(--sans);letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
#kick b{color:var(--ink);margin-right:.6em}
#ttl{font:700 42px/1.15 var(--serif);color:var(--ink);margin-top:6px}
#hdr.hide{opacity:0}
/* subtitles */
#subs{position:absolute;left:0;right:0;top:738px;height:108px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#subs span{max-width:1340px;text-align:center;font:500 27px/1.38 var(--sans);color:#fff;background:rgba(18,20,30,.86);
  padding:10px 22px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:opacity .25s}
#subs.off span{display:none}
#subs span.fade{opacity:0}
/* controls */
#ctl{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:16px;padding:0 22px;
  background:linear-gradient(transparent,rgba(18,20,30,.55));transition:opacity .35s;cursor:default}
#ctl.hide{opacity:0}
#ctl button{background:none;border:0;color:#fff;font:600 16px var(--sans);cursor:pointer;min-width:34px;height:34px;border-radius:6px}
#ctl button:hover{background:rgba(255,255,255,.15)}
#ctl button.offc{opacity:.45}
#time{color:#fff;font:500 15px var(--sans);min-width:118px;font-variant-numeric:tabular-nums}
#bar{flex:1;height:22px;position:relative;cursor:pointer}
#bar .bg{position:absolute;left:0;right:0;top:9px;height:4px;background:rgba(255,255,255,.3);border-radius:2px}
#bar .fg{position:absolute;left:0;top:9px;height:4px;background:#fff;border-radius:2px;width:0}
#bar .tk{position:absolute;top:6px;width:2px;height:10px;background:rgba(255,255,255,.7)}
#tip{position:absolute;bottom:30px;transform:translateX(-50%);background:#12141c;color:#fff;font:500 14px var(--sans);padding:4px 8px;border-radius:5px;white-space:nowrap;display:none}
#toast{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:#12141c;color:#fff;font:500 18px var(--sans);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#big{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:rgba(18,20,30,.7);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;pointer-events:none}
#big.show{opacity:1}
#big svg{width:46px;height:46px}
/* start screen: language choice (also unlocks speech, which browsers only allow after a click) */
#start{position:absolute;inset:0;background:rgba(18,20,30,.62);display:flex;align-items:center;justify-content:center;cursor:default}
#start.gone{display:none}
#start .box{background:var(--paper2);border-radius:18px;padding:48px 64px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#start .st{font:700 52px var(--serif);color:var(--ink)}
#start .ss{font:500 20px var(--sans);color:var(--mut);margin-top:8px;letter-spacing:.04em}
#start .row{display:flex;gap:22px;justify-content:center;margin-top:36px}
#start button{font:600 24px var(--sans);padding:16px 34px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
#start button[data-l="es"]{background:var(--inc);border-color:var(--inc)}
#start .note{margin-top:22px;font:15px var(--sans);color:var(--mut)}
/* svg typography */
.se{font-family:var(--serif)} .sa{font-family:var(--sans)}
.m{text-anchor:middle} .e{text-anchor:end}
.cap{font:700 14px var(--sans);letter-spacing:.14em;fill:var(--mut)}
.lb{font:22px var(--sans);fill:var(--ink)}
.sm{font:17px var(--sans);fill:var(--mut)}
.it{font-style:italic}
.card{fill:var(--paper2);stroke:var(--line);stroke-width:1.5}
.dark{fill:var(--ink)}
.eq{font-size:34px;color:var(--ink);display:flex;justify-content:center;align-items:center;height:100%;flex-direction:column;gap:6px}
.eq.small{font-size:28px}
/* scenes & steps */
.scene{opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s linear .6s}
.scene.cur{opacity:1;visibility:visible;transition:opacity .6s,visibility 0s}
[data-step]{opacity:0;transform:translateY(14px);transition:opacity .75s ease,transform .75s cubic-bezier(.2,.7,.2,1)}
[data-step].on{opacity:1;transform:none}
[data-step].on.past{opacity:.36}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease .2s}
.on .draw,.draw.on{stroke-dashoffset:0}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.grow.alt{transform:scaleY(.32)}
.grow.d{transition-delay:.7s}
.cutline{transition:stroke-dasharray .4s, opacity .6s}
.cutline.alt{stroke-dasharray:8 8;opacity:.45}
.hl{transition:fill .6s,stroke .6s}
.hl.alt{fill:#efe4f7;stroke:var(--ins)}
.vanish{transition:opacity .8s .6s}
.vanish.alt{opacity:.3}
.flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.pulse2{transform-box:fill-box;transform-origin:center;animation:pulse2 2.6s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.025)}}
.reset{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.knob{transform-box:view-box;transition:transform 1s cubic-bezier(.3,.7,.2,1) .4s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
<svg id="cv" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" aria-label="Animated explainer canvas">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#857f72"/></marker>
  <marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b4472f"/></marker>
  <marker id="an" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6a4c9c"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2d4f8f"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9a7419"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2c7a62"/></marker>
  <marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d2030"/></marker>
</defs>

<!-- ============ S0 · INTRO ============ -->
<g class="scene" id="s0">
  <g data-step="1"><text x="800" y="300" class="cap m" style="font-size:17px">AN ETHICAL MODEL · AI WELFARE RESEARCH PROPOSAL</text></g>
  <g data-step="1" data-d="300">
    <text x="800" y="400" class="se m" style="font-size:64px;font-weight:700;fill:var(--ink)">Does the system include</text>
    <text x="800" y="478" class="se m" style="font-size:64px;font-weight:700;fill:var(--ink)">the entities it affects?</text>
  </g>
  <g data-step="2">
    <rect x="330" y="560" width="200" height="46" rx="23" fill="var(--inc)"/><text x="430" y="590" class="m sa" style="font-size:19px;fill:#fff;font-weight:600">inclusion</text>
    <rect x="550" y="560" width="250" height="46" rx="23" fill="var(--ins)"/><text x="675" y="590" class="m sa" style="font-size:19px;fill:#fff;font-weight:600">instrumentalization</text>
    <rect x="820" y="560" width="200" height="46" rx="23" fill="var(--res)"/><text x="920" y="590" class="m sa" style="font-size:19px;fill:#fff;font-weight:600">constraint</text>
    <rect x="1040" y="560" width="230" height="46" rx="23" fill="none" stroke="var(--sem)" stroke-width="2"/><text x="1155" y="590" class="m sa" style="font-size:19px;fill:var(--sem);font-weight:600">reconstruction</text>
  </g>
</g>

<!-- ============ S1 · BACKGROUND ============ -->
<g class="scene" id="s1">
  <g data-step="1">
    <text x="260" y="200" class="cap m" style="fill:var(--inc)">2016 · ECONOMICS THESIS</text>
    <g fill="var(--inc)">
      <circle cx="215" cy="268" r="10"/><circle cx="258" cy="250" r="10"/><circle cx="302" cy="272" r="10"/><circle cx="235" cy="312" r="10"/><circle cx="285" cy="318" r="10"/>
    </g>
    <g stroke="var(--inc)" stroke-width="2.5">
      <path d="M215 252v-14" marker-end="url(#ai)"/><path d="M258 234v-14" marker-end="url(#ai)"/><path d="M302 286v14" marker-end="url(#ai)"/><path d="M235 296v-14" marker-end="url(#ai)"/><path d="M285 334v14" marker-end="url(#ai)"/>
    </g>

    <path d="M620 235V340" stroke="var(--res)" stroke-width="2" stroke-dasharray="5 6"/>

    <text x="620" y="422" class="se it m" style="font-size:21px;fill:var(--res)">three papers</text>
  </g>
  <g data-step="3">

    <rect x="1365" y="252" width="56" height="50" rx="8" class="card" style="stroke:var(--sem)"/><text x="1393" y="285" class="se m it" style="font-size:24px">x̂</text>
    <text x="1330" y="395" class="se it m" style="font-size:21px;fill:var(--sem)">Nobody receives exactly</text>
    <text x="1330" y="422" class="se it m" style="font-size:21px;fill:var(--sem)">what was said</text>

  <g data-step="5">
    <g fill="none" stroke-width="2.5">
      <path d="M260 445C260 540 600 520 760 585" stroke="var(--inc)" pathLength="1" class="draw"/>
      <path d="M620 445C620 520 720 540 780 585" stroke="var(--res)" pathLength="1" class="draw"/>
      <path d="M980 445C980 520 880 540 820 585" stroke="var(--cont)" pathLength="1" class="draw"/>

    <rect x="380" y="585" width="840" height="122" rx="14" class="dark"/>
    <text x="800" y="640" class="se it m" style="font-size:31px;fill:#fff">“Ethics is not declared — it emerges from structure.”</text>
    <text x="800" y="680" class="sa m" style="font-size:18px;fill:#e2c46e;font-weight:600;letter-spacing:.06em">2026 · AN ETHICAL MODEL</text>
  </g>
</g>

<!-- ============ S2 · WHAT DID IT UNDERSTAND ============ -->
<g class="scene" id="s2">
  <g data-step="1">

    <path d="M395 282H440" stroke="#857f72" stroke-width="2.5" marker-end="url(#a)"/>
    <g transform="translate(450 218)">
      <path d="M0 0H92L118 26V130H0Z" class="card"/>
      <path d="M18 40H96M18 60H96M18 80H80M18 100H90" stroke="#bdb3a0" stroke-width="3"/>
    </g>
    <text x="509" y="372" class="se it m" style="font-size:22px">signal y</text>

  </g>
  <g data-step="2">
    <foreignObject x="660" y="150" width="860" height="96"><div class="eq">

    </div></foreignObject>
    <text x="1090" y="275" class="se it m" style="font-size:21px;fill:var(--mut)">meaning is rebuilt, not received</text>
  </g>
  <g data-step="3">
    <path d="M572 300C610 300 610 410 650 410" fill="none" stroke="#857f72" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="655" y="300" width="400" height="235" rx="12" class="card" style="stroke:var(--sem)"/>
    <text x="855" y="330" class="cap m">THE RECEIVER</text>
    <rect x="833" y="345" width="44" height="44" rx="5" class="dark"/><text x="855" y="375" class="m se" style="fill:#fff;font-size:22px">A</text>

    </g>

    <text x="855" y="510" class="sa m" style="font-size:18px">objective g</text>
    <text x="965" y="510" class="sa m" style="font-size:18px">depth τ</text>
    <path d="M1060 418H1105" stroke="var(--sem)" stroke-width="2.5" marker-end="url(#as)"/>
    <rect x="1110" y="300" width="400" height="235" rx="12" class="card"/>
    <text x="1310" y="330" class="cap m">WHAT IT UNDERSTOOD</text>
    <circle cx="1220" cy="410" r="17" fill="#6b6f82"/><text x="1220" y="450" class="sm m">e₁</text>
    <rect x="1288" y="388" width="44" height="44" rx="5" class="dark"/><text x="1310" y="418" class="m se" style="fill:#fff;font-size:22px">A</text>
    <text x="1310" y="512" class="se it m" style="font-size:22px">reconstruction x̂</text>

<!-- ============ S3 · WHAT DOES IT DO ============ -->
<g class="scene" id="s3">
  <g data-step="1">
    <text x="215" y="215" class="se it m" style="font-size:25px;fill:var(--mut)">what it declares</text>
    <text x="385" y="220" class="se m" style="font-size:42px;fill:var(--ink)">≠</text>
    <text x="560" y="215" class="se m" style="font-size:25px;font-weight:700">what it maximizes</text>
    <text x="385" y="275" class="sa m" style="font-size:21px">real purpose <tspan class="se it" font-weight="700">F</tspan><tspan font-size="15" dy="5">core</tspan></text>
    <text x="385" y="315" class="se it m" style="font-size:19px;fill:var(--mut)" dy="-2">revealed in conflicts</text>
  </g>

  root.querySelectorAll("[data-alt]").forEach(e=>{
    const on=step>=+e.dataset.alt,was=e.classList.contains("alt");
    if(on&&!was&&e.dataset.altd)e.style.transitionDelay=e.dataset.altd+"ms";else if(!on)e.style.transitionDelay="";
    e.classList.toggle("alt",on);
  });
}
function clearScene(si){scenes[si].querySelectorAll(".on,.alt,.past").forEach(e=>{e.style.transitionDelay="0ms";e.classList.remove("on","alt","past");});}

function render(i){
  const c=T[i];
  if(c.si!==curScene){
    const old=curScene;curScene=c.si;
    if(old>=0){scenes[old].classList.remove("cur");setTimeout(()=>{if(curScene!==old)clearScene(old);},650);}
    scenes[c.si].classList.add("cur");
    const sc=SC[c.si];
    hdr.classList.add("hide");
    setTimeout(()=>{if(curScene!==c.si)return;setHeader(c.si);},titleOf(sc)?250:0);
  }
  applySteps(c.si,c.step);
  span.classList.add("fade");
  setTimeout(()=>{span.textContent=T[i].text;span.classList.remove("fade");},180);
  curCue=i;
  stopVoice();voiced=-1;if(playing)speakCue(i);
}
function setHeader(si){const sc=SC[si],k=kickOf(sc),ti=titleOf(sc);kick.innerHTML=k?`<b>${String(si).padStart(2,"0")}</b>${k}`:"";ttl.textContent=ti;hdr.classList.toggle("hide",!ti);}

/* ---- voice: Web Speech API (free, runs in the viewer's browser, no files) ---- */
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voiceOn=!!synth,voices=[],vIdx={en:-1,es:-1},gen=0,speaking=false,voiced=-1,holdMs=0;
const warned={};
// what is read aloud can differ from what is shown (symbols, model names, DOI)
const SAY={
 all:[[/\s*—\s*/g,", "],[/[«»“”]/g,""],[/F-core/g,"F core"],[/:?\s*DOI\s+[\w./]+/g,""]],
 en:[[/Ŵ/g,"W-hat"],[/x\*/g,"x-star"],[/τ/g,"tau"],[/(Qwen\/)?Qwen3-4B-Instruct-2507/g,"Qwen 3, 4 B, Instruct"]],
 es:[[/Ŵ/g,"W gorro"],[/x\*/g,"equis estrella"],[/τ/g,"tau"],[/señal, y:/g,"señal, ye:"],[/(Qwen\/)?Qwen3-4B-Instruct-2507/g,"Qwen 3 de 4 B, Instruct"]]};
function sayText(s){for(const [r,v] of SAY.all.concat(SAY[lang]))s=s.replace(r,v);return s.trim();}
// short utterances: some browsers cut off a single utterance after ~15 s
function chunks(s){
  const out=[];
  (s.match(/[^.!?]+[.!?]*/g)||[s]).forEach(p=>{p=p.trim();if(!p)return;
    while(p.length>200){let k=-1;for(const ch of [";",":",","]){const j=p.lastIndexOf(ch,200);if(j>60){k=j;break;}}
      if(k<0)k=p.lastIndexOf(" ",200);if(k<=0)break;out.push(p.slice(0,k+1));p=p.slice(k+1).trim();}
    if(out.length&&out[out.length-1].length+p.length<160)out[out.length-1]+=" "+p;else out.push(p);});
  return out;
}
const norm=l=>(l||"").toLowerCase().replace("_","-");
function voiceList(l){return voices.filter(v=>norm(v.lang).startsWith(l));}
function score(v,l){const n=v.name+" "+v.lang;let s=0;
  if(/natural|neural|online/i.test(n))s+=4;if(/google|premium|enhanced|siri/i.test(n))s+=2;
  const pref=l==="es"?{"es-co":1.6,"es-mx":1.2,"es-us":1.1,"es-419":1.1,"es-es":.8}:{"en-us":1,"en-gb":.8};
  return s+(pref[norm(v.lang)]||0);}
function curVoice(){const L=voiceList(lang);if(!L.length)return null;
  if(vIdx[lang]<0||vIdx[lang]>=L.length){let b=0;L.forEach((v,i)=>{if(score(v,lang)>score(L[b],lang))b=i;});vIdx[lang]=b;}
  return L[vIdx[lang]];}
function loadVoices(){voices=synth.getVoices();vIdx={en:-1,es:-1};}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener("voiceschanged",loadVoices);else synth.onvoiceschanged=loadVoices;}
function stopVoice(){gen++;speaking=false;holdMs=0;if(synth){synth.cancel();}}
function speakCue(i){
  if(!synth||!voiceOn||i<0)return;
  stopVoice();voiced=i;const my=gen;const v=curVoice();
  if(!v&&voices.length){if(!warned[lang]){warned[lang]=1;say(UI[lang].novoice);}return;}
  const parts=chunks(sayText(T[i].text));if(!parts.length)return;
  speaking=true;
  setTimeout(()=>{if(my!==gen)return;if(synth.paused)synth.resume();
    parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);if(v)u.voice=v;u.lang=v?v.lang:(lang==="es"?"es-ES":"en-US");
      u.rate=Math.max(.5,Math.min(2,speed));
      u.onend=u.onerror=()=>{if(my===gen&&k===parts.length-1)speaking=false;};
      synth.speak(u);});},60);
}

function seek(ms){t=Math.max(0,Math.min(total-1,ms));const i=cueAt(t);if(i!==curCue)render(i);draw();}
function draw(){fg.style.width=(t/total*100)+"%";tm.textContent=fmt(t)+" / "+fmt(total);}
function setPlay(p){playing=p;pp.textContent=p?"❚❚":"▶";
  if(synth&&voiceOn){
    if(!p){if(speaking)synth.pause();}
    else if(voiced!==curCue)speakCue(curCue);
    else if(speaking){synth.resume();setTimeout(()=>{if(playing&&speaking&&!synth.speaking&&!synth.pending)speakCue(curCue);},400);}
  }bigp.setAttribute("d",p?"M7 5h4v14H7zM13 5h4v14h-4z":"M8 5v14l11-7z");big.classList.add("show");setTimeout(()=>big.classList.remove("show"),500);poke();}
function poke(){idle=0;ctl.classList.remove("hide");stage.style.cursor="pointer";}

function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(playing){let nt=t+dt*speed;
    // voice gate: don't leave a cue while its narration is still being spoken
    if(voiceOn&&speaking&&curCue>=0){const end=T[curCue].start+T[curCue].dur-1;
      if(nt>=end){nt=Math.max(t,end);holdMs+=dt;
        if((holdMs>600&&!synth.speaking&&!synth.pending)||holdMs>25000)speaking=false;}}
    t=nt;if(t>=total){t=total-1;playing=false;pp.textContent="▶";}
    const i=cueAt(t);if(i!==curCue)render(i);draw();
    idle+=dt;if(idle>2600){ctl.classList.add("hide");stage.style.cursor="none";}}
  requestAnimationFrame(loop);
}

/* chapter ticks */
const bar=$("#bar"),tip=$("#tip"),toast=$("#toast");
function drawTicks(){bar.querySelectorAll(".tk").forEach(e=>e.remove());
  chapters.forEach(ch=>{if(ch.start===0)return;const d=document.createElement("div");d.className="tk";d.style.left=(ch.start/total*100)+"%";bar.appendChild(d);});}
drawTicks();
function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(say.h);say.h=setTimeout(()=>toast.classList.remove("show"),2200);}
function setLang(l){
  const ci=curCue<0?0:curCue;lang=l;document.documentElement.lang=l;$("#lng").textContent=l.toUpperCase();
  buildTimeline();drawTicks();t=T[ci].start;setHeader(T[ci].si);render(ci);draw();say(UI[l].lang);
}
function barMs(ev){const r=bar.getBoundingClientRect();return (ev.clientX-r.left)/r.width*total;}
bar.addEventListener("click",e=>{e.stopPropagation();seek(barMs(e));poke();});
bar.addEventListener("mousemove",e=>{const ms=barMs(e);const ch=[...chapters].reverse().find(c=>c.start<=ms)||chapters[0];const r=bar.getBoundingClientRect();tip.style.display="block";tip.style.left=((e.clientX-r.left)/r.width*bar.offsetWidth)+"px";tip.textContent=fmt(ms)+" · "+ch.label;});
bar.addEventListener("mouseleave",()=>tip.style.display="none");

/* controls */
ctl.addEventListener("click",e=>e.stopPropagation());
pp.onclick=()=>setPlay(!playing);
$("#spd").onclick=()=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];$("#spd").textContent=speed+"×";};
$("#cc").onclick=()=>{subs.classList.toggle("off");$("#cc").classList.toggle("offc");};
$("#fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
$("#srt").onclick=()=>{
  const f=ms=>{const h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60,r=Math.floor(ms%1000);return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(r).padStart(3,"0")}`;};
  const txt=T.map((c,i)=>`${i+1}\n${f(c.start)} --> ${f(c.start+c.dur)}\n${c.text}\n`).join("\n");
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));a.download=`an-ethical-model.${lang}.srt`;a.click();}catch(e){}
  try{navigator.clipboard.writeText(txt).then(()=>say(UI[lang].copied),()=>say(UI[lang].dl));}catch(e){say(UI[lang].dl);}
};
$("#lng").onclick=()=>setLang(lang==="en"?"es":"en");
$("#vc").onclick=()=>{voiceOn=!voiceOn;$("#vc").textContent=voiceOn?"🔊":"🔇";say(voiceOn?UI[lang].von:UI[lang].voff);
  if(voiceOn){voiced=-1;if(playing)speakCue(curCue);}else stopVoice();};
if(!synth)$("#vc").style.display="none";
function nextVoice(){const L=voiceList(lang);if(!L.length){say(UI[lang].novoice);return;}curVoice();vIdx[lang]=(vIdx[lang]+1)%L.length;
  say(UI[lang].voice+L[vIdx[lang]].name);voiced=-1;if(playing)speakCue(curCue);}

/* start screen */
const start=$("#start");
function begin(l){
  if(synth){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u);}catch(e){}} // unlock speech inside the click (iOS)
  start.classList.add("gone");
  if(l!==lang)setLang(l);else $("#lng").textContent=l.toUpperCase();
  setPlay(true);
}
start.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("button[data-l]");if(b)begin(b.dataset.l);});
stage.addEventListener("click",()=>setPlay(!playing));
document.addEventListener("mousemove",poke);
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(!start.classList.contains("gone")){if(k===" "||k==="enter"){e.preventDefault();begin(lang);}else if(k==="e")begin("en");else if(k==="l")begin(lang==="en"?"es":"en");return;}
  if(k===" "||k==="k"){e.preventDefault();setPlay(!playing);}
  else if(k==="l")$("#lng").click();
  else if(k==="v")$("#vc").click();
  else if(k==="n")nextVoice();
  else if(k==="arrowright"){seek(T[Math.min(T.length-1,curCue+1)].start);poke();}
  else if(k==="arrowleft"){seek(t-T[curCue].start>1500?T[curCue].start:T[Math.max(0,curCue-1)].start);poke();}
  else if(k==="arrowdown"||k==="pagedown"){const n=chapters.find(c=>c.start>t);if(n)seek(n.start);poke();}
  else if(k==="arrowup"||k==="pageup"){const p=[...chapters].reverse().find(c=>c.start<T[curCue].start-1);seek(p?p.start:0);poke();}
  else if(k==="home"){seek(0);}
  else if(k==="c")$("#cc").click();
  else if(k==="s")$("#spd").click();
  else if(k==="f")$("#fs").click();
  else if(k==="g")$("#srt").click();
});

/* fit */
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener("resize",fit);fit();

/* deep link: #t=seconds or #paused (for testing) */
const h=location.hash;const mt=h.match(/t=([\d.]+)/);
$("#lng").textContent=lang.toUpperCase();pp.textContent="▶";
render(0);if(mt)seek(+mt[1]*1000);
if(/paused/.test(h))start.classList.add("gone");                       // testing: skip start screen, stay paused
else if(/autoplay/.test(h)){start.classList.add("gone");setPlay(true);} // testing: skip start screen and play (silent until a click)
draw();requestAnimationFrame(loop);
window.__player={seek,get T(){return T;},get total(){return total;},get t(){return t;},get lang(){return lang;},setLang,pause(){setPlay(false);}};
})();
</script>
</body>
